<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="130" height="130" fill="none">
  <defs>
    <!-- Text Path for circular text -->
    <path id="circlePathOuter" d="M 100, 100 m -78, 0 a 78,78 0 1,1 156,0 a 78,78 0 1,1 -156,0" />
    <path id="circlePathInner" d="M 100, 100 m -58, 0 a 58,58 0 1,0 116,0 a 58,58 0 1,0 -116,0" />
  </defs>

  <!-- Outer Double Ring -->
  <circle cx="100" cy="100" r="92" stroke="#1D4ED8" stroke-width="3" stroke-dasharray="6,2" opacity="0.85"/>
  <circle cx="100" cy="100" r="86" stroke="#1D4ED8" stroke-width="1.8" opacity="0.85"/>
  
  <!-- Inner Ring -->
  <circle cx="100" cy="100" r="56" stroke="#1D4ED8" stroke-width="1.8" opacity="0.85"/>

  <!-- Curved Text -->
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#1D4ED8" letter-spacing="2.2" opacity="0.9">
    <textPath href="#circlePathOuter" startOffset="50%" text-anchor="middle">
      UNIVERSITAS PAMULANG
    </textPath>
  </text>

  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#1D4ED8" letter-spacing="1.8" opacity="0.9">
    <textPath href="#circlePathInner" startOffset="50%" text-anchor="middle">
      BIRO SARANA DAN PRASARANA
    </textPath>
  </text>

  <!-- Center Verification Badge -->
  <g transform="translate(100, 100)" text-anchor="middle" fill="#1D4ED8" opacity="0.9">
    <!-- Star accents -->
    <polygon points="0,-32 3,-24 11,-24 5,-19 7,-11 0,-16 -7,-11 -5,-19 -11,-24 -3,-24" fill="#1D4ED8"/>
    
    <text y="-2" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" letter-spacing="1">TERVERIFIKASI</text>
    <line x1="-34" y1="3" x2="34" y2="3" stroke="#1D4ED8" stroke-width="1.5"/>
    <text y="15" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">AUDIT KIR 2026</text>
    <text y="27" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#2563EB">NIP.19760312</text>
  </g>
</svg>
